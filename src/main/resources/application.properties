spring.application.name=JavaWebExam_lhgbao


#=======================
# DATABASE
#=======================
spring.datasource.url=jdbc:mysql://localhost:3306/pet_boarding
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#=======================
# MYBATIS
#=======================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=training.javaweb.JavaWebExam_lhgbao.entites

# chuyển snake_case -> camelCase
mybatis.configuration.map-underscore-to-camel-case=true

#=======================
# SERVER
#=======================
server.port=8084

#=======================
# FILE UPLOAD
#=======================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

#=======================
# Swagger
#=======================
springdoc.swagger-ui.path=/swagger-ui.html