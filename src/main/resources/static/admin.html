<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plant Manager</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<nav>
  <div class="nav-brand"><span>🌿</span> Plant Manager</div>
  <a href="./statistic.html">🔢 Thống kê</a>
  <a href="#khu-tim-kiem">🔍 Tìm kiếm</a>
  <a href="#khu-danh-sach">📋 Danh sách</a>
  <a href="#khu-phan-trang">🔢 Phân trang</a>
</nav>

<section id="danh-sach">
  <div class="container">
    <div class="section-title">🌱 Danh sách cây cảnh</div>

    <div class="toolbar" id="khu-tim-kiem">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Tìm theo tên cây, danh mục..." />
      </div>
      <select id="sort-select">
        <option value="name-asc">Sắp xếp: Tên A-Z</option>
        <option value="name-desc">Sắp xếp: Tên Z-A</option>
        <option value="price-asc">Giá thấp → cao</option>
        <option value="price-desc">Giá cao → thấp</option>
        <option value="plant_date-desc">Ngày mới nhất</option>
        <option value="plant_date-asc">Ngày cũ nhất</option>
      </select>
      <div class="view-toggle">
        <button id="view-table-btn" title="Dạng bảng" style="flex:1;">☰</button>
        <button id="view-grid-btn" class="active" title="Dạng thẻ" style="flex:1;">⊞</button>
      </div>
      <button class="btn btn-primary" id="add-btn">+ Thêm cây</button>
    </div>

    <div class="filter-pills" id="filter-pills">
      <span class="pill active" data-category="all">Tất cả</span>
      <span class="pill" data-category="Cây trong nhà">🏠 Cây trong nhà</span>
      <span class="pill" data-category="Cây ngoài trời">🌳 Cây ngoài trời</span>
      <span class="pill" data-category="Cây ăn quả">🍎 Cây ăn quả</span>
    </div>

    <div id="khu-danh-sach">
      <div class="table-wrap" id="table-wrap" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Tên cây</th>
              <th>Danh mục</th>
              <th>Giá (VNĐ)</th>
              <th>Ngày trồng</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="table-body">
            </tbody>
        </table>
      </div>

      <div class="grid-view" id="grid-container">
        </div>
    </div>
	
	<div class="chart-container">
	    <canvas id="categoryChart"></canvas>
	</div>

    <div class="pagination" id="khu-phan-trang" id="pagination-container">
       </div>
  </div>
</section>
<!-- Modal xem chi tiết -->
<div id="detail-modal" class="modal-overlay" style="display:none;">
  <div class="modal">

    <button id="close-modal" class="modal-close">
      ✖
    </button>

    <h2 class="modal-title">
      Chi tiết cây cảnh
    </h2>

    <img
      id="modal-image"
      class="modal-img"
      src=""
      alt=""
    />

    <div class="detail-row">
      <div class="detail-label">Tên cây</div>
      <div class="detail-value" id="modal-name"></div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Danh mục</div>
      <div class="detail-value" id="modal-category"></div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Giá</div>
      <div class="detail-value" id="modal-price"></div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Ngày trồng</div>
      <div class="detail-value" id="modal-date"></div>
    </div>

    <div class="detail-row">
      <div class="detail-label">Mô tả</div>
      <div class="detail-value" id="modal-description"></div>
    </div>

  </div>
</div>

<div
  id="form-modal"
  class="modal-overlay"
  style="display:none;"
>
  <div class="modal">

    <button
      id="close-form-modal"
      class="modal-close"
    >
      ✖
    </button>

    <h2
      id="form-title"
      class="modal-title"
    >
      Thêm cây
    </h2>

    <form id="plant-form">

      <input type="hidden" id="plant-id">
      <div class="form-group">
        <label>Tên cây</label>
        <input id="plant-name" type="text">
        <div id="name-error" class="form-error"></div>
      </div>
      <div class="form-group">
        <label>Danh mục</label>

        <select id="plant-category">
          
        </select>
      </div>

      <div class="form-group">
        <label>Giá</label>

        <input id="plant-price" type="number">
        <div id="price-error class="form-error"></div>
      </div>

      <div class="form-group">
        <label>Ngày trồng</label>
        <input id="plant-date" type="date">
        <div id="date-error" class="form-error"></div>
      </div>

      <div class="form-group">
        <label>Mô tả</label>

        <textarea
          id="plant-description"
        ></textarea>
      </div>

      <div class="form-group">
        <label>Link hình ảnh</label>

        <input
          id="plant-img"
          type="text"
        >
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn"
          id="cancel-form"
        >
          Hủy
        </button>

        <button
          type="submit"
          class="btn btn-primary"
        >
          Lưu
        </button>
      </div>

    </form>

  </div>
</div>
    
<footer>
  Plant Manager · Web Basic Test
</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./index.js"></script>

</body>
</html>
