<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Plant Manager</title>
    <link rel="stylesheet" href="./statistic.css"> 
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        .form-error { color: red; font-size: 0.85rem; margin-top: 5px; }
        .btn-block { width: 100%; padding: 12px; background: #2e7d32; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;}
        .btn-block:hover { background: #215823; }
        .text-center { text-align: center; margin-top: 15px; }
        .text-center a { color: #2e7d32; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
      <div class="nav-brand"><span>🌱</span> Plant Manager</div>
      <a href="./index.html">⬅️ Quay lại Trang chủ</a>
    </nav>

    <div class="login-container">
        <h2 style="text-align: center; margin-bottom: 25px; color: #2e7d32;">Đăng Nhập Hệ Thống</h2>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Tài khoản</label>
                <input type="text" id="username" placeholder="Nhập tài khoản của bạn...">
                <div id="username-error" class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu...">
                <div id="password-error" class="form-error"></div>
            </div>

            <button type="submit" class="btn-block">Đăng Nhập</button>
            
            <div class="text-center">
                Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a>
            </div>
        </form>
    </div>

    <script src="./login.js"></script>
</body>
</html>
